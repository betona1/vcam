[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vcam"
dynamic = ["version"]
description = "vCAM — 로컬 우선 Windows 화면 녹화·캡처 도구"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "mss>=9.0",
    "dxcam>=0.3",
    "soundcard>=0.4.3",
    "pillow>=11.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
vcam = "vcam.__main__:main"

[tool.hatch.version]
path = "src/vcam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vcam"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "integration: FFmpeg가 필요한 통합 테스트",
    "smoke: 실제 화면을 캡처하는 스모크 테스트",
]
