[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vcam"
dynamic = ["version"]
description = "vCAM — 로컬 우선 Windows 화면 녹화·캡처 도구"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "mss>=9.0",
    "dxcam>=0.3",
    "soundcard>=0.4.3",
    "pillow>=11.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.10"]
# 자막 만들기(SRT): 로컬 Whisper 음성 인식 + 오프라인/온라인 번역. 없으면 앱은 안내만 보여 준다.
subtitles = [
    "faster-whisper>=1.2",
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "deep-translator>=1.11",
    "huggingface_hub>=0.30",
]
# NVIDIA GPU 가속용 cuBLAS/cuDNN 런타임 (약 1GB). 없으면 CPU로 동작한다.
subtitles-cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
# 인터넷 영상 내려받기(YouTube·TikTok·Instagram 등): yt-dlp(Unlicense). mutagen(GPL)은 넣지 않는다 — 썸네일/태그 삽입에만 필요.
# YouTube는 JS 런타임(Deno 권장)이 있어야 모든 화질을 받을 수 있다. 없으면 앱이 설치 방법을 안내한다.
# curl_cffi(MIT, 약 5MB): TikTok·Instagram이 요구하는 브라우저 위장(TLS 지문). 버전 범위는 yt-dlp가 지원하는 범위를 따른다.
download = [
    "yt-dlp>=2026.10",
    "yt-dlp-ejs>=0.8",
    "curl_cffi>=0.10,<0.18",
    "pycryptodomex>=3.20",
    "certifi",
    "requests>=2.32",
    "urllib3>=2.2",
    "websockets>=13",
    "brotli",
]

[project.scripts]
vcam = "vcam.__main__:main"

[tool.hatch.version]
path = "src/vcam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vcam"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "integration: FFmpeg가 필요한 통합 테스트",
    "smoke: 실제 화면을 캡처하는 스모크 테스트",
]
