<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- vavelingCam 앱 아이콘: 카메라를 든 바브링(직접 그린 벡터) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="1" stop-color="#3b2a9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6defc"/>
    </radialGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fff1dc"/>
      <stop offset="1" stop-color="#f3d6b4"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7d8bff"/>
      <stop offset="0.6" stop-color="#3a2f9a"/>
      <stop offset="1" stop-color="#1c1452"/>
    </radialGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f6e"/>
      <stop offset="1" stop-color="#1f2246"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9ff6ff"/>
      <stop offset="0.45" stop-color="#2f8bff"/>
      <stop offset="1" stop-color="#0d1a4d"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glow)"/>

  <!-- 귀 -->
  <circle cx="58" cy="112" r="24" fill="url(#fur)"/>
  <circle cx="58" cy="112" r="14" fill="#f6c3c9"/>
  <circle cx="198" cy="112" r="24" fill="url(#fur)"/>
  <circle cx="198" cy="112" r="14" fill="#f6c3c9"/>

  <!-- 머리(털) -->
  <ellipse cx="128" cy="110" rx="70" ry="64" fill="url(#fur)"/>
  <!-- 말린 머리 한 가닥 -->
  <path d="M120 50 C112 30 128 18 146 24 C160 29 160 46 146 48 C137 49 134 40 140 37"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 50 C112 30 128 18 146 24" fill="none" stroke="#d9d0fa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 얼굴 -->
  <path d="M128 78 C112 66 82 70 78 98 C74 122 84 150 128 154 C172 150 182 122 178 98 C174 70 144 66 128 78 Z" fill="url(#face)"/>

  <!-- 이마의 작은 푸른 불꽃 -->
  <path d="M128 64 C123 71 123 76 128 81 C133 76 133 71 128 64 Z" fill="#6fe3ff"/>

  <!-- 눈 -->
  <ellipse cx="106" cy="108" rx="15" ry="17" fill="url(#iris)"/>
  <ellipse cx="150" cy="108" rx="15" ry="17" fill="url(#iris)"/>
  <circle cx="101" cy="101" r="6" fill="#ffffff"/>
  <circle cx="145" cy="101" r="6" fill="#ffffff"/>
  <circle cx="111" cy="115" r="2.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="155" cy="115" r="2.6" fill="#ffffff" opacity="0.9"/>

  <!-- 볼터치, 코, 입 -->
  <ellipse cx="88" cy="128" rx="10" ry="6" fill="#ff9fb4" opacity="0.65"/>
  <ellipse cx="168" cy="128" rx="10" ry="6" fill="#ff9fb4" opacity="0.65"/>
  <ellipse cx="128" cy="124" rx="4.5" ry="3.2" fill="#6b4a3a"/>
  <path d="M119 131 Q123.5 137 128 131 Q132.5 137 137 131" fill="none" stroke="#6b4a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 카메라 -->
  <rect x="96" y="148" width="30" height="14" rx="5" fill="#2b2f5c"/>
  <rect x="66" y="156" width="124" height="74" rx="18" fill="url(#cam)" stroke="#8f86ff" stroke-width="3"/>
  <circle cx="128" cy="193" r="29" fill="#14183a" stroke="#c9c3ff" stroke-width="4"/>
  <circle cx="128" cy="193" r="20" fill="url(#lens)"/>
  <circle cx="128" cy="193" r="7" fill="#0a1030"/>
  <circle cx="121" cy="186" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="172" cy="172" r="6" fill="#ff4d6d"/>

  <!-- 카메라를 잡은 두 손 -->
  <ellipse cx="68" cy="192" rx="14" ry="16" fill="url(#face)"/>
  <ellipse cx="188" cy="192" rx="14" ry="16" fill="url(#face)"/>
  <path d="M60 186 Q66 182 72 186 M60 194 Q66 190 72 194" fill="none" stroke="#e2b893" stroke-width="2" stroke-linecap="round"/>
  <path d="M184 186 Q190 182 196 186 M184 194 Q190 190 196 194" fill="none" stroke="#e2b893" stroke-width="2" stroke-linecap="round"/>
</svg>
