name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: 단위 테스트
        run: python -m pytest -q -p no:cacheprovider tests/unit
